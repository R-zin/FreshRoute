name: FreshRoute Backend CI

on:
  push:
    branches: [ main, 'feat/**', 'fix/**', 'gemini/**' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests & Solver Verification
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Solver Standalone Self-Test
        env:
          PYTHONPATH: .
        run: |
          python backend/core/solver.py

      - name: Run Pytest Test Suite
        env:
          PYTHONPATH: .
        run: |
          pytest tests/test_solver.py -v --durations=10

      - name: Smoke Test FastAPI Health Endpoint
        env:
          PYTHONPATH: .
        run: |
          python -c "
          from fastapi.testclient import TestClient
          from backend.main import app
          client = TestClient(app)
          res = client.get('/api/v1/health')
          assert res.status_code == 200, f'Health check failed: {res.text}'
          assert res.json()['status'] == 'ok'
          print('Health check passed:', res.json())
          "

      - name: Verify Default Scenario API Endpoint
        env:
          PYTHONPATH: .
        run: |
          python -c "
          from fastapi.testclient import TestClient
          from backend.main import app
          client = TestClient(app)
          res = client.get('/api/v1/default-scenario')
          assert res.status_code == 200, f'Default scenario endpoint failed: {res.text}'
          data = res.json()
          assert data['status'] in ('OPTIMAL', 'FEASIBLE')
          assert data['constraint_audit']['mass_balance_passed'] is True
          assert data['constraint_audit']['capacity_limits_passed'] is True
          assert data['constraint_audit']['shelf_life_limits_passed'] is True
          assert data['constraint_audit']['demand_caps_passed'] is True
          assert data['kpis']['optimized']['net_revenue'] > data['kpis']['baseline']['net_revenue']
          print(f'Default scenario verified: {data[\"status\"]}, Solve Time: {data[\"solve_time_ms\"]} ms')
          "

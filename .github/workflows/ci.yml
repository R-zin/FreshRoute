name: FreshRoute CI

on:
  push:
    branches: [ main, 'feat/**', 'fix/**', 'gemini/**' ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Intensive Solver & Scenario Testing
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Solver Standalone Self-Test
        env:
          PYTHONPATH: .
        run: |
          python backend/core/solver.py

      - name: Run Benchmark Scenarios Generator & Solvers
        env:
          PYTHONPATH: .
        run: |
          python datasets/generate_scenarios.py

      - name: Run Pytest Test Suite (25 Tests: Parser, Solver, Scenarios)
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ -v --durations=10

      - name: Smoke Test FastAPI Health Endpoint
        env:
          PYTHONPATH: .
        run: |
          python -c "
          from fastapi.testclient import TestClient
          from backend.main import app
          client = TestClient(app)
          res = client.get('/api/v1/health')
          assert res.status_code == 200, f'Health check failed: {res.text}'
          assert res.json()['status'] == 'ok'
          print('Health check passed:', res.json())
          "

      - name: Verify Default Scenario API Endpoint
        env:
          PYTHONPATH: .
        run: |
          python -c "
          from fastapi.testclient import TestClient
          from backend.main import app
          client = TestClient(app)
          res = client.get('/api/v1/default-scenario')
          assert res.status_code == 200, f'Default scenario endpoint failed: {res.text}'
          data = res.json()
          assert data['status'] in ('OPTIMAL', 'FEASIBLE')
          assert data['constraint_audit']['mass_balance_passed'] is True
          assert data['constraint_audit']['capacity_limits_passed'] is True
          assert data['constraint_audit']['shelf_life_limits_passed'] is True
          assert data['constraint_audit']['demand_caps_passed'] is True
          assert data['kpis']['optimized']['net_revenue'] > data['kpis']['baseline']['net_revenue']
          print(f'Default scenario verified: {data[\"status\"]}, Solve Time: {data[\"solve_time_ms\"]} ms')
          "

      - name: Intensive Real-World Scenario Stress Test
        env:
          PYTHONPATH: .
        run: |
          python -c "
          from fastapi.testclient import TestClient
          from backend.main import app
          import pathlib

          client = TestClient(app)
          datasets_dir = pathlib.Path('datasets')

          # Verify multipart upload of dirty stress-test CSVs
          with open(datasets_dir / 'scenario_4_corrupt_batches.csv', 'rb') as fb, \
               open(datasets_dir / 'scenario_4_corrupt_markets.csv', 'rb') as fm:
              res = client.post('/api/v1/upload-dataset', files={
                  'batches_file': ('scenario_4_corrupt_batches.csv', fb, 'text/csv'),
                  'markets_file': ('scenario_4_corrupt_markets.csv', fm, 'text/csv'),
              })
              assert res.status_code == 200, f'Upload corrupt scenario 4 failed: {res.text}'
              data = res.json()
              assert data['status'] == 'OPTIMAL'
              assert data['constraint_audit']['mass_balance_passed'] is True
              assert len(data['ingestion_warnings']) > 10
              print('Scenario 4 Stress Test Verified: OPTIMAL with', len(data['ingestion_warnings']), 'warnings')
          "

  frontend-build:
    name: Frontend TypeScript & Vite Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm --prefix frontend install

      - name: Run TypeScript & Vite Production Build
        run: npm --prefix frontend run build
